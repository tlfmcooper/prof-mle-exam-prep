<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="primary-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle with subtle gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#primary-gradient)" opacity="0.1"/>

  <!-- Main Logo Group -->
  <g filter="url(#shadow)">
    <!-- "M" - Left geometric shape -->
    <path d="M 140 180 L 140 332 L 180 332 L 180 240 L 230 300 L 256 270 L 230 240 L 180 180 Z"
          fill="url(#primary-gradient)"
          rx="8"/>

    <!-- "L" - Right geometric shape -->
    <path d="M 282 180 L 282 332 L 372 332 L 372 292 L 322 292 L 322 180 Z"
          fill="url(#primary-gradient)"
          rx="8"/>

    <!-- Connecting abstract element -->
    <circle cx="256" cy="256" r="24" fill="#3b82f6" opacity="0.8"/>

    <!-- Neural network dots (ML theme) -->
    <circle cx="200" cy="200" r="8" fill="#60a5fa"/>
    <circle cx="312" cy="220" r="8" fill="#60a5fa"/>
    <circle cx="256" cy="320" r="8" fill="#60a5fa"/>

    <!-- Connecting lines (subtle) -->
    <line x1="200" y1="200" x2="256" y2="256" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
    <line x1="312" y1="220" x2="256" y2="256" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
    <line x1="256" y1="256" x2="256" y2="320" stroke="#60a5fa" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Border with rounded corners -->
  <rect x="16" y="16" width="480" height="480" rx="64" ry="64"
        fill="none" stroke="url(#primary-gradient)" stroke-width="4" opacity="0.2"/>
</svg>
